name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # The unit tests are pure and never launch a browser, so skip the download.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      # Catches a Worker that won't bundle (bad import, Node-only module) before deploy.
      - run: npx wrangler deploy --dry-run --outdir dist
